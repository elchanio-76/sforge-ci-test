# Temporary (M9 verification): the CI identities must not be able to provision.
# Both jobs are expected to fail with access errors.
name: Least privilege check

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target to plan with the CI identity
        required: true
        type: choice
        options: [aws, azure]

permissions: {}

jobs:
  provision-aws:
    name: Provision aws with the CI identity
    if: inputs.target == 'aws'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # sign in to the cloud with GitHub's OIDC token
    concurrency:
      group: sforge-aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/staticforge
          key: staticforge-${{ runner.os }}-${{ hashFiles('.sforge/iac/**/.terraform.lock.hcl') }}
          restore-keys: staticforge-${{ runner.os }}-
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.SFORGE_AWS_ROLE_ARN }}
          aws-region: eu-north-1
      - name: Plan with the CI identity
        env:
          CLOUDFLARE_API_TOKEN: not-a-token # gets sforge past its own check, so the clouds answer
        run: npx sforge provision aws --diff

  provision-azure:
    name: Provision azure with the CI identity
    if: inputs.target == 'azure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write # sign in to the cloud with GitHub's OIDC token
    concurrency:
      group: sforge-azure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/staticforge
          key: staticforge-${{ runner.os }}-${{ hashFiles('.sforge/iac/**/.terraform.lock.hcl') }}
          restore-keys: staticforge-${{ runner.os }}-
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.SFORGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.SFORGE_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SFORGE_AZURE_SUBSCRIPTION_ID }}
      - name: Plan with the CI identity
        env:
          CLOUDFLARE_API_TOKEN: not-a-token # gets sforge past its own check, so the clouds answer
          AZURE_SUBSCRIPTION_ID: ${{ vars.SFORGE_AZURE_SUBSCRIPTION_ID }}
        run: npx sforge provision azure --diff
