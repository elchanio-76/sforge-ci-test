# Generated by `sforge ci init`. Edit freely; run it again with --force to start over.
name: Remove previews

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  remove-firebase:
    name: Remove the preview on firebase
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # sign in to the cloud with GitHub's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/staticforge
          key: staticforge-${{ runner.os }}-${{ hashFiles('.sforge/iac/**/.terraform.lock.hcl') }}
          restore-keys: staticforge-${{ runner.os }}-
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.SFORGE_FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SFORGE_FIREBASE_SERVICE_ACCOUNT }}
      - name: Remove the preview
        run: npx sforge preview-destroy firebase pr-${{ github.event.number }}
