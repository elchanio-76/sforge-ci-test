# Generated by `sforge ci init`. Edit freely; run it again with --force to start over.
name: Roll back

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target to roll back
        required: true
        type: choice
        options: [firebase]
      to:
        description: Version to serve (see `sforge versions`); empty for the one before the active version
        required: false
        type: string

permissions: {}

jobs:
  rollback-firebase:
    name: Roll back firebase
    if: inputs.target == 'firebase'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write # sign in to the cloud with GitHub's OIDC token
    concurrency:
      group: sforge-firebase
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/staticforge
          key: staticforge-${{ runner.os }}-${{ hashFiles('.sforge/iac/**/.terraform.lock.hcl') }}
          restore-keys: staticforge-${{ runner.os }}-
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.SFORGE_FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SFORGE_FIREBASE_SERVICE_ACCOUNT }}
      - name: Roll back
        env:
          TO: ${{ inputs.to }}
        run: npx sforge rollback firebase --yes ${TO:+--to "$TO"}
