# Generated by `sforge ci init`. Edit freely; run it again with --force to start over.
name: Site

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the findings to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/staticforge
          key: staticforge-${{ runner.os }}-${{ hashFiles('.sforge/iac/**/.terraform.lock.hcl') }}
          restore-keys: staticforge-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1
      - name: Install Chromium for the rendered checks
        run: npx playwright-core@1.64.1 install --with-deps --only-shell chromium
      - name: Build and check
        run: npx sforge check --headless --format sarif --output sforge.sarif
      - name: Upload the findings to code scanning
        if: always() && hashFiles('sforge.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sforge.sarif
          category: sforge

  preview-firebase:
    name: Preview on firebase
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # sign in to the cloud with GitHub's OIDC token
    concurrency:
      group: sforge-firebase-pr-${{ github.event.number }}
      cancel-in-progress: true
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/staticforge
          key: staticforge-${{ runner.os }}-${{ hashFiles('.sforge/iac/**/.terraform.lock.hcl') }}
          restore-keys: staticforge-${{ runner.os }}-
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.SFORGE_FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SFORGE_FIREBASE_SERVICE_ACCOUNT }}
      - id: deploy
        name: Deploy the preview
        run: |
          npx sforge deploy firebase --preview pr-${{ github.event.number }} --no-headless --json > "$RUNNER_TEMP/deploy.json"
          echo "url=$(jq -r .data.url "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_OUTPUT"

  comment:
    name: Comment the preview URLs
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [preview-firebase]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Add or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL_FIREBASE: ${{ needs.preview-firebase.outputs.url }}
          RESULT_FIREBASE: ${{ needs.preview-firebase.result }}
        run: |
          marker='<!-- sforge-preview -->'
          body="$marker"$'\n'"**Previews** of ${HEAD_SHA::7}:"$'\n'
          body+=$'\n'"- firebase: ${URL_FIREBASE:-${RESULT_FIREBASE}}"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  deploy-firebase:
    name: Deploy firebase
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # sign in to the cloud with GitHub's OIDC token
    concurrency:
      group: sforge-firebase
      cancel-in-progress: false # concurrent deploys refuse to overwrite each other's history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/staticforge
          key: staticforge-${{ runner.os }}-${{ hashFiles('.sforge/iac/**/.terraform.lock.hcl') }}
          restore-keys: staticforge-${{ runner.os }}-
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.SFORGE_FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SFORGE_FIREBASE_SERVICE_ACCOUNT }}
      - id: deploy
        name: Deploy
        run: |
          npx sforge deploy firebase --no-headless --json > "$RUNNER_TEMP/deploy.json"
          echo "url=$(jq -r .data.url "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_OUTPUT"
