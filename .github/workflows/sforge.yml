# Generated by `sforge ci init`. Edit freely; run it again with --force to start over.
name: Site

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the findings to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/staticforge
          key: staticforge-${{ runner.os }}-${{ hashFiles('.sforge/iac/**/.terraform.lock.hcl') }}
          restore-keys: staticforge-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1
      - name: Install Chromium for the rendered checks
        run: npx playwright-core@1.64.1 install --with-deps --only-shell chromium
      - name: Build and check
        run: npx sforge check --headless --format sarif --output sforge.sarif
      - name: Upload the findings to code scanning
        if: always() && hashFiles('sforge.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sforge.sarif
          category: sforge

  preview-aws:
    name: Preview on aws
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sign in to the cloud with GitHub's OIDC token
    concurrency:
      group: sforge-aws-pr-${{ github.event.number }}
      cancel-in-progress: true
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/staticforge
          key: staticforge-${{ runner.os }}-${{ hashFiles('.sforge/iac/**/.terraform.lock.hcl') }}
          restore-keys: staticforge-${{ runner.os }}-
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.SFORGE_AWS_ROLE_ARN }}
          aws-region: eu-north-1
      - id: deploy
        name: Deploy the preview
        run: |
          npx sforge deploy aws --preview pr-${{ github.event.number }} --no-headless --json > deploy.json
          echo "url=$(jq -r .data.url deploy.json)" >> "$GITHUB_OUTPUT"

  preview-azure:
    name: Preview on azure
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sign in to the cloud with GitHub's OIDC token
    concurrency:
      group: sforge-azure-pr-${{ github.event.number }}
      cancel-in-progress: true
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/staticforge
          key: staticforge-${{ runner.os }}-${{ hashFiles('.sforge/iac/**/.terraform.lock.hcl') }}
          restore-keys: staticforge-${{ runner.os }}-
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.SFORGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.SFORGE_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SFORGE_AZURE_SUBSCRIPTION_ID }}
      - id: deploy
        name: Deploy the preview
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.SFORGE_AZURE_SUBSCRIPTION_ID }}
        run: |
          npx sforge deploy azure --preview pr-${{ github.event.number }} --no-headless --json > deploy.json
          echo "url=$(jq -r .data.url deploy.json)" >> "$GITHUB_OUTPUT"

  comment:
    name: Comment the preview URLs
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [preview-aws, preview-azure]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL_AWS: ${{ needs.preview-aws.outputs.url }}
          RESULT_AWS: ${{ needs.preview-aws.result }}
          URL_AZURE: ${{ needs.preview-azure.outputs.url }}
          RESULT_AZURE: ${{ needs.preview-azure.result }}
        run: |
          marker='<!-- sforge-preview -->'
          body="$marker"$'\n'"**Previews** of ${HEAD_SHA::7}:"$'\n'
          body+=$'\n'"- aws: ${URL_AWS:-${RESULT_AWS}}"
          body+=$'\n'"- azure: ${URL_AZURE:-${RESULT_AZURE}}"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  deploy-aws:
    name: Deploy aws
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sign in to the cloud with GitHub's OIDC token
    concurrency:
      group: sforge-aws
      cancel-in-progress: false # concurrent deploys refuse to overwrite each other's history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/staticforge
          key: staticforge-${{ runner.os }}-${{ hashFiles('.sforge/iac/**/.terraform.lock.hcl') }}
          restore-keys: staticforge-${{ runner.os }}-
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.SFORGE_AWS_ROLE_ARN }}
          aws-region: eu-north-1
      - id: deploy
        name: Deploy
        run: |
          npx sforge deploy aws --no-headless --json > deploy.json
          echo "url=$(jq -r .data.url deploy.json)" >> "$GITHUB_OUTPUT"

  deploy-azure:
    name: Deploy azure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # sign in to the cloud with GitHub's OIDC token
    concurrency:
      group: sforge-azure
      cancel-in-progress: false # concurrent deploys refuse to overwrite each other's history
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/staticforge
          key: staticforge-${{ runner.os }}-${{ hashFiles('.sforge/iac/**/.terraform.lock.hcl') }}
          restore-keys: staticforge-${{ runner.os }}-
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.SFORGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.SFORGE_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SFORGE_AZURE_SUBSCRIPTION_ID }}
      - id: deploy
        name: Deploy
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.SFORGE_AZURE_SUBSCRIPTION_ID }}
        run: |
          npx sforge deploy azure --no-headless --json > deploy.json
          echo "url=$(jq -r .data.url deploy.json)" >> "$GITHUB_OUTPUT"
